name: Application Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellantis-market-intelligence
    env:
      FLASK_ENV: development
      ENABLE_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m compileall -q ai analytics api dashboard events ingestion relationships reports scripts storage
      - run: uv run --frozen python -m scripts.audit_browser_dependencies
      - run: uv run --frozen pip-audit --format json --output data/reports/ci-python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            stellantis-market-intelligence/data/reports/ci-python-audit.json
            stellantis-market-intelligence/data/reports/browser-audit.json