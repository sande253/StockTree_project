# Stellantis Market Impact Intelligence - Company Universe (Phase 1)
#
# This file is the single source of truth for which companies the system tracks.
# IMPORTANT: `relationship_type` here is only a coarse category label (e.g. "oem",
# "supplier") for filtering/grouping. It is NOT a claim of a documented business
# relationship with Stellantis. Documented relationships (with evidence) are
# established separately in Phase 11/12 (relationships/*).
#
# Fields:
#   ticker            - exchange ticker symbol (as used by the market-data provider)
#   company_name      - full legal / common name
#   exchange          - primary listing exchange
#   sector            - broad sector classification
#   industry          - narrower industry classification
#   country           - country of primary listing / headquarters
#   relationship_type - coarse category: self | oem | supplier_tier1 | supplier_tier2 |
#                        semiconductor | battery | ev | adas | autonomous_driving |
#                        software | cloud_technology | logistics | commodity | other

companies:
