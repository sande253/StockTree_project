# Event-detection thresholds (Phase 4 - STLA Event Detection).
# A day is flagged as an event if ANY of the four rules below trigger.
# `detection_method` on the resulting event records which rule(s) fired.
thresholds:
  # Rule 1: absolute daily return (e.g. 0.05 = 5%)
  absolute_return: 0.05
  # Rule 2: |z-score of price| over the rolling window (Phase 3 `zscore`)
  zscore: 2.0
  # Rule 3: |daily_return| / rolling_volatility (volatility-adjusted movement)
  volatility_adjusted: 2.0
  # Rule 4: |volume z-score| over the rolling window (abnormal volume)
  volume_zscore: 2.0
  # Severity buckets, keyed on |daily_return|
  severity:
    high: 0.07
    medium: 0.04
    low: 0.02

# Rule-based event classification (Phase 9 - Event Classification).
