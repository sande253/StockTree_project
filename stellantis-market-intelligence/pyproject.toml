[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellantis-market-intelligence"
version = "0.1.0"
description = "AI-powered market and corporate-network intelligence platform centered on Stellantis (STLA)."
requires-python = ">=3.11"
dependencies = [
  # Core data
  "pandas>=2.2",
  "polars>=1.9",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  # Config / validation
  "pyyaml>=6.0",
  "pydantic>=2.9",
  # Market data (Phase 2+)
  "yfinance>=0.2.44",
  # News/filings ingestion (Phase 8+)
  "requests>=2.31",
  "certifi>=2026.10.19",
  "brotli>=1.2.1",
  "defusedxml>=0.7.1",
  # Analytics (Phase 3+)
  "numpy>=1.26",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  # Graph (Phase 11+)
  "networkx>=3.3",
  # Vector search (Phase 18-20). Embeddings are TF-IDF (scikit-learn), not a neural
  # model - no network access for a model download in this environment.
  "faiss-cpu>=1.8",
  # LLM client (Phase 20/21) - Groq cloud API, reads GROQ_API_KEY env var.
  "groq>=0.11",
  "python-dotenv>=1.0",
  # Web backend (Flask, per project convention)
  "flask>=3.0",
  # Production WSGI server
  "gunicorn>=21.2",
  "waitress>=3.0",
  # Monitoring and health
  "prometheus-client>=0.19",
  # Performance
  "flask-compress>=1.14",
  "flask-caching>=2.1",
  "APScheduler>=3.11,<4",
  "Flask-Limiter>=3.12,<5",
  "Flask-WTF>=1.2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pip-audit>=2.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
